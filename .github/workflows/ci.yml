name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in `engines`; 22 is what we develop on.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: packageManager in package.json is the
      # single source of truth, and specifying both is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Build first: the packaging gate packs the real tarball, so dist/ has to
      # exist before the tests run.
      - run: pnpm build
      - run: pnpm test:coverage

      - name: validate the examples
        run: node dist/cli.js validate examples/echo-agent/echo.suite.ts examples/calibration/calibrate.suite.ts examples/yaml-cases/yaml.suite.ts examples/guarded-agent/dealership.suite.ts

      # Cases written in YAML must behave exactly like cases written in TS.
      - name: yaml cases example
        run: node dist/cli.js run examples/yaml-cases/yaml.suite.ts --fail-under --no-report

      # The example is the contract. If it stops passing, the contract broke.
      - name: echo-agent example
        run: node dist/cli.js run examples/echo-agent/echo.suite.ts --fail-under --no-report

      # Strict replay: these must work with no API key and no network.
      - name: dealership example replays offline
        run: node dist/cli.js run examples/guarded-agent/dealership.suite.ts --cassettes replay --fail-under --no-report

      - name: calibration example replays offline
        run: node dist/cli.js calibrate examples/calibration/calibrate.suite.ts --cassettes replay --no-report

      # And the buggy agent must stay red, or the harness stopped catching things.
      - name: buggy agent must fail
        run: |
          if node dist/cli.js run tests/fixtures/failing.suite.ts --fail-under --no-report; then
            echo "::error::the deliberately buggy suite passed; the harness is not catching failures"
            exit 1
          fi
